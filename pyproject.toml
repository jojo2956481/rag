[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.12.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.13.4",
    "fire",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
